name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m compileall -q genreplay tests
      - run: python -m genreplay --version
      - run: python -m genreplay networks
      - name: Verify public Python API
        run: |
          python - <<'PY'
          import genreplay
          from genreplay import Capsule, GenLayerRpcClient, GenReplay
          assert genreplay.__version__ == "0.2.0"
          assert Capsule is not None
          assert GenLayerRpcClient is not None
          assert GenReplay is not None
          print("public API: PASS")
          PY
      - name: Build dependency-free wheel
        run: python -m pip wheel . --no-deps -w dist
